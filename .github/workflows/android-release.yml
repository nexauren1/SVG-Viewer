name: Android build and release

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: svg-viewer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build Android
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android host project
        run: flutter create --platforms=android --org com.nexauren --project-name svgviewer build_app

      - name: Overlay application source and Android folder scanner
        run: |
          rm -rf build_app/lib build_app/test
          cp -R lib test build_app/
          cp pubspec.yaml build_app/pubspec.yaml
          mkdir -p build_app/android/app/src/main/kotlin/com/nexauren/svgviewer
          cp android/app/src/main/kotlin/com/nexauren/svgviewer/MainActivity.kt build_app/android/app/src/main/kotlin/com/nexauren/svgviewer/MainActivity.kt

      - name: Resolve dependencies
        working-directory: build_app
        run: flutter pub get

      - name: Analyze Dart code
        working-directory: build_app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run automated tests
        working-directory: build_app
        run: flutter test --reporter expanded

      - name: Build split release APKs
        working-directory: build_app
        run: flutter build apk --release --split-per-abi -P force-version-code-ignoring-abi=true

      - name: Build Google Play App Bundle
        working-directory: build_app
        run: flutter build appbundle --release

      - name: Prepare named packages and report sizes
        shell: bash
        run: |
          set -euo pipefail
          OUT="build_app/build/app/outputs/flutter-apk"
          DIST="build_app/release"
          mkdir -p "$DIST"
          cp "$OUT/app-arm64-v8a-release.apk" "$DIST/SVG-Viewer-Android-arm64-v8a.apk"
          cp "$OUT/app-armeabi-v7a-release.apk" "$DIST/SVG-Viewer-Android-armeabi-v7a.apk"
          cp "$OUT/app-x86_64-release.apk" "$DIST/SVG-Viewer-Android-x86_64.apk"
          cp "build_app/build/app/outputs/bundle/release/app-release.aab" "$DIST/SVG-Viewer-Google-Play.aab"
          echo "### Android package sizes" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| File | Size |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---:|" >> "$GITHUB_STEP_SUMMARY"
          for file in "$DIST"/*; do
            size="$(du -h "$file" | cut -f1)"
            echo "| $(basename "$file") | $size |" >> "$GITHUB_STEP_SUMMARY"
            ls -lh "$file"
          done
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "For the itel A665L, download SVG-Viewer-Android-arm64-v8a.apk only." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Android packages
        uses: actions/upload-artifact@v4
        with:
          name: svg-viewer-android-${{ github.run_number }}
          path: build_app/release/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish rolling nightly release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly-${{ github.run_number }}
          target_commitish: main
          name: "SVG Viewer — Nightly Build #${{ github.run_number }}"
          body: |
            Automated development build of SVG Viewer from the main branch.
            APKs are split by Android CPU architecture to reduce download size.

            For the itel A665L and other 64-bit ARM Android devices, download:
            SVG-Viewer-Android-arm64-v8a.apk

            For 32-bit ARM devices, use SVG-Viewer-Android-armeabi-v7a.apk.
            The x86_64 APK is intended mainly for compatible emulators.
            SVG-Viewer-Google-Play.aab is for Google Play Console; do not download it just to install the app on a phone.
            This is a pre-release for device testing, not a production Google Play release.
          prerelease: true
          make_latest: false
          files: |
            build_app/release/SVG-Viewer-Android-arm64-v8a.apk
            build_app/release/SVG-Viewer-Android-armeabi-v7a.apk
            build_app/release/SVG-Viewer-Android-x86_64.apk
            build_app/release/SVG-Viewer-Google-Play.aab

      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: SVG Viewer ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            APKs are split by Android CPU architecture to reduce download size.
            For the itel A665L and other 64-bit ARM Android devices, download SVG-Viewer-Android-arm64-v8a.apk.
            The AAB is for Google Play Console.
          files: |
            build_app/release/SVG-Viewer-Android-arm64-v8a.apk
            build_app/release/SVG-Viewer-Android-armeabi-v7a.apk
            build_app/release/SVG-Viewer-Android-x86_64.apk
            build_app/release/SVG-Viewer-Google-Play.aab
