name: svg_viewer
description: An offline-first SVG viewer and source editor for Android.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.3.0
  file_picker: ^10.3.7
  shared_preferences: ^2.5.3
  share_plus: ^13.3.1
  cross_file: ^0.3.4+2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
